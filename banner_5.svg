<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#181818" stroke-width="1"/>
    </pattern>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="1"/>
    </linearGradient>

    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="orbitPathA" d="M -20,0 A 20,8 0 1,1 20,0 A 20,8 0 1,1 -20,0" fill="none"/>
    <path id="orbitPathB" d="M -20,0 A 20,8 0 1,1 20,0 A 20,8 0 1,1 -20,0" fill="none"/>
    <path id="orbitPathC" d="M -16,0 A 16,6 0 1,1 16,0 A 16,6 0 1,1 -16,0" fill="none"/>
    <path id="orbitPathD" d="M -16,0 A 16,6 0 1,1 16,0 A 16,6 0 1,1 -16,0" fill="none"/>
  </defs>

  <rect width="1200" height="220" fill="#0A0A0A"/>

  <rect width="1200" height="220" fill="url(#grid)">
    <animate attributeName="opacity" values="0.35;0.7;0.35" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- circuit traces -->
  <g stroke="#333333" stroke-width="1" fill="none">
    <path d="M40,40 L160,40 L160,80 L260,80" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" values="0;-40" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M1160,40 L1040,40 L1040,80 L940,80" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" values="0;-40" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M40,180 L160,180 L160,150 L260,150" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" values="0;-40" dur="3.8s" repeatCount="indefinite"/>
    </path>
    <path d="M1160,180 L1040,180 L1040,150 L940,150" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" values="0;-40" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- circuit nodes -->
  <g fill="#6E6E6E" filter="url(#glow)">
    <circle cx="40" cy="40" r="2.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="80" r="2.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="40" r="2.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="80" r="2.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="180" r="2.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="150" r="2.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="180" r="2.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="150" r="2.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="2.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- data pulses travelling along traces -->
  <g fill="#B5B5B5" filter="url(#glow)">
    <circle r="2.2"><animateMotion dur="3s" repeatCount="indefinite" path="M40,40 L160,40 L160,80 L260,80"/></circle>
    <circle r="2.2"><animateMotion dur="3.4s" repeatCount="indefinite" path="M1160,40 L1040,40 L1040,80 L940,80"/></circle>
    <circle r="2.2"><animateMotion dur="3.8s" repeatCount="indefinite" path="M40,180 L160,180 L160,150 L260,150"/></circle>
    <circle r="2.2"><animateMotion dur="3.2s" repeatCount="indefinite" path="M1160,180 L1040,180 L1040,150 L940,150"/></circle>
  </g>

  <!-- radar pings at key junctions -->
  <g fill="none" stroke="#4A4A4A" stroke-width="1">
    <circle cx="260" cy="80" r="0">
      <animate attributeName="r" values="0;34" dur="3s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="3s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="80" r="0">
      <animate attributeName="r" values="0;34" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="150" r="0">
      <animate attributeName="r" values="0;34" dur="3.4s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="3.4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="150" r="0">
      <animate attributeName="r" values="0;34" dur="3.4s" begin="1.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="3.4s" begin="1.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- orbital chip marks -->
  <g transform="translate(1120,40) rotate(20)">
    <use href="#orbitPathA" xlink:href="#orbitPathA" stroke="#3A3A3A" stroke-width="1"/>
    <circle r="1.8" fill="#B5B5B5" filter="url(#glow)">
      <animateMotion dur="4s" repeatCount="indefinite"><mpath href="#orbitPathA" xlink:href="#orbitPathA"/></animateMotion>
    </circle>
  </g>
  <g transform="translate(1120,40) rotate(-20)">
    <use href="#orbitPathB" xlink:href="#orbitPathB" stroke="#333333" stroke-width="1"/>
    <circle r="1.6" fill="#9A9A9A" filter="url(#glow)">
      <animateMotion dur="5.5s" repeatCount="indefinite"><mpath href="#orbitPathB" xlink:href="#orbitPathB"/></animateMotion>
    </circle>
  </g>
  <circle cx="1120" cy="40" r="2.2" fill="#8A8A8A" filter="url(#glow)"/>

  <g transform="translate(80,180) rotate(-25)">
    <use href="#orbitPathC" xlink:href="#orbitPathC" stroke="#3A3A3A" stroke-width="1"/>
    <circle r="1.6" fill="#B5B5B5" filter="url(#glow)">
      <animateMotion dur="4.6s" repeatCount="indefinite"><mpath href="#orbitPathC" xlink:href="#orbitPathC"/></animateMotion>
    </circle>
  </g>
  <g transform="translate(80,180) rotate(25)">
    <use href="#orbitPathD" xlink:href="#orbitPathD" stroke="#333333" stroke-width="1"/>
    <circle r="1.4" fill="#9A9A9A" filter="url(#glow)">
      <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#orbitPathD" xlink:href="#orbitPathD"/></animateMotion>
    </circle>
  </g>
  <circle cx="80" cy="180" r="2" fill="#8A8A8A" filter="url(#glow)"/>

  <!-- HUD corner brackets -->
  <g stroke="#3C3C3C" stroke-width="1.2" fill="none">
    <path d="M14,38 L14,14 L38,14">
      <animate attributeName="opacity" values="0.35;0.75;0.35" dur="8s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M1162,14 L1186,14 L1186,38">
      <animate attributeName="opacity" values="0.35;0.75;0.35" dur="8s" begin="2s" repeatCount="indefinite"/>
    </path>
    <path d="M14,182 L14,206 L38,206">
      <animate attributeName="opacity" values="0.35;0.75;0.35" dur="8s" begin="4s" repeatCount="indefinite"/>
    </path>
    <path d="M1162,206 L1186,206 L1186,182">
      <animate attributeName="opacity" values="0.35;0.75;0.35" dur="8s" begin="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- telemetry flicker readout -->
  <g font-family="'JetBrains Mono', monospace" font-size="8" fill="#454545">
    <text x="150" y="208">0x2F19<animate attributeName="opacity" values="0.15;0.5;0.15" dur="4s" begin="0s" repeatCount="indefinite"/></text>
    <text x="330" y="208">0x9A0C<animate attributeName="opacity" values="0.15;0.5;0.15" dur="4.6s" begin="0.6s" repeatCount="indefinite"/></text>
    <text x="510" y="208">0xC331<animate attributeName="opacity" values="0.15;0.5;0.15" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></text>
    <text x="690" y="208">0x71BE<animate attributeName="opacity" values="0.15;0.5;0.15" dur="5s" begin="0.3s" repeatCount="indefinite"/></text>
    <text x="870" y="208">0x0E42<animate attributeName="opacity" values="0.15;0.5;0.15" dur="4.2s" begin="1.6s" repeatCount="indefinite"/></text>
    <text x="1050" y="208">0xA207<animate attributeName="opacity" values="0.15;0.5;0.15" dur="3.9s" begin="0.9s" repeatCount="indefinite"/></text>
  </g>

  <!-- diagonal light sweep -->
  <g>
    <rect x="-500" y="-200" width="400" height="700" fill="url(#sweep)" transform="rotate(18 200 110)">
      <animateTransform attributeName="transform" type="translate"
        values="-100 0; 1500 0; -100 0" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect width="1200" height="220" fill="url(#fade)" opacity="0.5"/>

  <line x1="0" y1="1" x2="1200" y2="1" stroke="#1F1F1F" stroke-width="1"/>
  <line x1="0" y1="219" x2="1200" y2="219" stroke="#1F1F1F" stroke-width="1"/>

  <text x="600" y="122" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace"
        font-size="24" letter-spacing="5" fill="#5A5A5A">
    SYSTEMS &#183; ENGINEERING &#183; BUILD
    <animate attributeName="opacity" values="0.3;0.85;0.3" dur="5s" repeatCount="indefinite"/>
  </text>
</svg>
