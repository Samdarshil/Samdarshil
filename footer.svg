<svg width="100%" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Session ending: terminal shutdown sequence and closing quote">
  <defs>
    <radialGradient id="bgGlow" cx="75%" cy="70%" r="80%">
      <stop offset="0%" stop-color="#0D1428" />
      <stop offset="60%" stop-color="#070A16" />
      <stop offset="100%" stop-color="#040509" />
    </radialGradient>
    <clipPath id="fClip"><rect x="1" y="1" width="998" height="258" rx="10" /></clipPath>
    <style>.mono{font-family:'Fira Code',Consolas,monospace;}</style>
  </defs>

  <g clip-path="url(#fClip)">
    <rect width="1000" height="260" fill="url(#bgGlow)" />

    <!-- chrome -->
    <rect x="0" y="0" width="1000" height="30" fill="#070A16" fill-opacity="0.7" />
    <line x1="0" y1="30" x2="1000" y2="30" stroke="#1E293B" stroke-width="1" />
    <circle cx="18" cy="15" r="3.5" fill="none" stroke="#475569" stroke-width="1.1" />
    <circle cx="32" cy="15" r="3.5" fill="none" stroke="#475569" stroke-width="1.1" />
    <circle cx="46" cy="15" r="3.5" fill="none" stroke="#475569" stroke-width="1.1" />
    <text x="64" y="19" class="mono" font-size="11" fill="#64748B">terminal://session.ending</text>

    <!-- orbit graphic -->
    <circle cx="890" cy="190" r="46" fill="none" stroke="#1E293B" stroke-width="1" />
    <circle cx="890" cy="190" r="18" fill="#0E1730" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="1" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 890 190" to="360 890 190" dur="18s" repeatCount="indefinite" />
      <circle cx="936" cy="190" r="3" fill="#22D3EE" />
    </g>

    <!-- shutdown lines -->
<text x="40" y="78" class="mono" font-size="13" fill="#7DD3FC" opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.050;1" dur="6.5s" begin="0s" repeatCount="1" fill="freeze" />&gt; FLUSHING BUFFERS...</text>
<text x="40" y="100" class="mono" font-size="13" fill="#7DD3FC" opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.104;1" dur="6.5s" begin="0s" repeatCount="1" fill="freeze" />&gt; SAVING STATE...</text>
<text x="40" y="122" class="mono" font-size="13" fill="#7DD3FC" opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.158;1" dur="6.5s" begin="0s" repeatCount="1" fill="freeze" />&gt; CLOSING CONNECTIONS...</text>
<text x="40" y="144" class="mono" font-size="13" fill="#7DD3FC" opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.212;1" dur="6.5s" begin="0s" repeatCount="1" fill="freeze" />&gt; SYSTEM DISCONNECTING...</text>

    <!-- progress bar -->
    <g class="mono" font-size="12" fill="#94A3B8" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.72;1" dur="6.5s" begin="0s" repeatCount="1" fill="freeze" />
      <rect x="40" y="176" width="220" height="10" rx="2" fill="none" stroke="#1E293B" stroke-width="1" />
      <rect x="42" y="178" width="216" height="6" fill="#34D399">
        <animate attributeName="width" values="0;216" dur="1.2s" begin="4.03s" fill="freeze" />
      </rect>
      <text x="270" y="185">100%</text>
    </g>

    <g class="mono" font-size="13" fill="#34D399" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.95;1" dur="6.5s" begin="0s" repeatCount="1" fill="freeze" />
      <text x="40" y="216">&gt; BACK ONLINE AT THE NEXT COMMIT.</text>
    </g>

    <!-- quote -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.65;1" dur="6.5s" begin="0s" repeatCount="1" fill="freeze" />
      <text x="520" y="110" class="mono" font-size="20" fill="#F5F7FF">&#8220;Session ended.</text>
      <text x="520" y="138" class="mono" font-size="20" fill="#F5F7FF">The next commit is</text>
      <text x="520" y="166" class="mono" font-size="20" fill="#F5F7FF">already loading.&#8221;</text>
      <text x="520" y="196" class="mono" font-size="13" fill="#A78BFA">&#8212; Darshil</text>
      <rect x="614" y="184" width="8" height="16" fill="#A78BFA">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="4.23s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- footer caption -->
    <text x="500" y="246" text-anchor="middle" class="mono" font-size="10.5" fill="#334155">Built with curiosity, cold coffee, and late-night commits.</text>
  </g>

  <rect x="0.5" y="0.5" width="999" height="259" rx="10" fill="none" stroke="#1E293B" stroke-width="1" />
</svg>
