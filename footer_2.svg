<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <pattern id="fgrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#181818" stroke-width="1"/>
    </pattern>

    <linearGradient id="fsweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ffade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="1"/>
    </linearGradient>

    <filter id="fglow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <path id="fOrbitA" d="M -18,0 A 18,7 0 1,1 18,0 A 18,7 0 1,1 -18,0" fill="none"/>
    <path id="fOrbitB" d="M -18,0 A 18,7 0 1,1 18,0 A 18,7 0 1,1 -18,0" fill="none"/>
  </defs>

  <rect width="1200" height="150" fill="#0A0A0A"/>

  <rect width="1200" height="150" fill="url(#fgrid)">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g stroke="#333333" stroke-width="1" fill="none">
    <path d="M40,30 L160,30 L160,58 L260,58" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" values="0;-40" dur="3.1s" repeatCount="indefinite"/>
    </path>
    <path d="M1160,30 L1040,30 L1040,58 L940,58" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" values="0;-40" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#6E6E6E" filter="url(#fglow)">
    <circle cx="40" cy="30" r="2.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="58" r="2.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="30" r="2.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="58" r="2.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="#B5B5B5" filter="url(#fglow)">
    <circle r="2"><animateMotion dur="3.1s" repeatCount="indefinite" path="M40,30 L160,30 L160,58 L260,58"/></circle>
    <circle r="2"><animateMotion dur="3.5s" repeatCount="indefinite" path="M1160,30 L1040,30 L1040,58 L940,58"/></circle>
  </g>

  <g fill="none" stroke="#4A4A4A" stroke-width="1">
    <circle cx="260" cy="58" r="0">
      <animate attributeName="r" values="0;30" dur="3.2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="3.2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="58" r="0">
      <animate attributeName="r" values="0;30" dur="3.2s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="3.2s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(600,32) rotate(18)">
    <use href="#fOrbitA" xlink:href="#fOrbitA" stroke="#3A3A3A" stroke-width="1"/>
    <circle r="1.7" fill="#B5B5B5" filter="url(#fglow)">
      <animateMotion dur="4.2s" repeatCount="indefinite"><mpath href="#fOrbitA" xlink:href="#fOrbitA"/></animateMotion>
    </circle>
  </g>
  <g transform="translate(600,32) rotate(-18)">
    <use href="#fOrbitB" xlink:href="#fOrbitB" stroke="#333333" stroke-width="1"/>
    <circle r="1.5" fill="#9A9A9A" filter="url(#fglow)">
      <animateMotion dur="5.6s" repeatCount="indefinite"><mpath href="#fOrbitB" xlink:href="#fOrbitB"/></animateMotion>
    </circle>
  </g>
  <circle cx="600" cy="32" r="2" fill="#8A8A8A" filter="url(#fglow)"/>

  <g stroke="#3C3C3C" stroke-width="1.2" fill="none">
    <path d="M14,26 L14,14 L38,14"><animate attributeName="opacity" values="0.35;0.75;0.35" dur="8s" begin="0s" repeatCount="indefinite"/></path>
    <path d="M1162,14 L1186,14 L1186,26"><animate attributeName="opacity" values="0.35;0.75;0.35" dur="8s" begin="2s" repeatCount="indefinite"/></path>
    <path d="M14,124 L14,136 L38,136"><animate attributeName="opacity" values="0.35;0.75;0.35" dur="8s" begin="4s" repeatCount="indefinite"/></path>
    <path d="M1162,136 L1186,136 L1186,124"><animate attributeName="opacity" values="0.35;0.75;0.35" dur="8s" begin="6s" repeatCount="indefinite"/></path>
  </g>

  <g font-family="'JetBrains Mono', monospace" font-size="8" fill="#454545">
    <text x="200" y="132">0x4C21<animate attributeName="opacity" values="0.15;0.5;0.15" dur="4.1s" begin="0.2s" repeatCount="indefinite"/></text>
    <text x="440" y="132">0x8F03<animate attributeName="opacity" values="0.15;0.5;0.15" dur="4.7s" begin="0.9s" repeatCount="indefinite"/></text>
    <text x="760" y="132">0xD119<animate attributeName="opacity" values="0.15;0.5;0.15" dur="3.8s" begin="1.4s" repeatCount="indefinite"/></text>
    <text x="1000" y="132">0x2AE7<animate attributeName="opacity" values="0.15;0.5;0.15" dur="4.4s" begin="0.5s" repeatCount="indefinite"/></text>
  </g>

  <g>
    <rect x="-500" y="-100" width="400" height="400" fill="url(#fsweep)" transform="rotate(18 200 75)">
      <animateTransform attributeName="transform" type="translate"
        values="-100 0; 1500 0; -100 0" dur="9.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect width="1200" height="150" fill="url(#ffade)" opacity="0.35"/>

  <line x1="0" y1="1" x2="1200" y2="1" stroke="#1F1F1F" stroke-width="1"/>
  <line x1="0" y1="149" x2="1200" y2="149" stroke="#1F1F1F" stroke-width="1"/>

  <text x="600" y="92" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace"
        font-size="15" letter-spacing="2.4" fill="#5A5A5A">
    BUILD NEVER STOPS &#8212; ONLY COMMITS DO
    <animate attributeName="opacity" values="0.3;0.85;0.3" dur="5s" repeatCount="indefinite"/>
  </text>
</svg>
