    <circle cx="600.0" cy="225.8" r="1.26" fill="#7DD3FC"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.27s" begin="0.28s" repeatCount="indefinite" /></circle>
    <circle cx="846.9" cy="108.7" r="1.34" fill="#7DD3FC"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.63s" begin="1.86s" repeatCount="indefinite" /></circle>
    <circle cx="532.4" cy="307.1" r="1.35" fill="#7DD3FC"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.72s" begin="1.95s" repeatCount="indefinite" /></circle>
    <circle cx="737.9" cy="327.3" r="1.25" fill="#7DD3FC"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="4.77s" begin="2.94s" repeatCount="indefinite" /></circle>
    <circle cx="968.9" cy="85.3" r="1.3" fill="#7DD3FC"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="4.55s" begin="2.49s" repeatCount="indefinite" /></circle>
    <circle cx="52.4" cy="166.1" r="1.58" fill="#7DD3FC"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="4.52s" begin="1.61s" repeatCount="indefinite" /></circle>
    <circle cx="218.7" cy="169.7" r="1.05" fill="#7DD3FC"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.63s" begin="1.28s" repeatCount="indefinite" /></circle>

    <!-- constellation accent -->
<line x1="700" y1="210" x2="742" y2="190" stroke="#22D3EE" stroke-width="0.7" stroke-opacity="0.35" />
<line x1="742" y1="190" x2="788" y2="224" stroke="#22D3EE" stroke-width="0.7" stroke-opacity="0.35" />
<line x1="788" y1="224" x2="820" y2="196" stroke="#22D3EE" stroke-width="0.7" stroke-opacity="0.35" />
<line x1="788" y1="224" x2="776" y2="258" stroke="#22D3EE" stroke-width="0.7" stroke-opacity="0.35" />
<line x1="776" y1="258" x2="734" y2="250" stroke="#22D3EE" stroke-width="0.7" stroke-opacity="0.35" />
<line x1="734" y1="250" x2="700" y2="210" stroke="#22D3EE" stroke-width="0.7" stroke-opacity="0.35" />
<circle cx="700" cy="210" r="1.8" fill="#BAE6FD"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.59s" begin="1.18s" repeatCount="indefinite" /></circle>
<circle cx="742" cy="190" r="1.8" fill="#BAE6FD"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.1s" begin="0.49s" repeatCount="indefinite" /></circle>
<circle cx="788" cy="224" r="1.8" fill="#BAE6FD"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.98s" begin="1.34s" repeatCount="indefinite" /></circle>
<circle cx="820" cy="196" r="1.8" fill="#BAE6FD"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.13s" begin="0.35s" repeatCount="indefinite" /></circle>
<circle cx="776" cy="258" r="1.8" fill="#BAE6FD"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.59s" begin="1.15s" repeatCount="indefinite" /></circle>
<circle cx="734" cy="250" r="1.8" fill="#BAE6FD"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.76s" begin="1.07s" repeatCount="indefinite" /></circle>

    <!-- comet, infrequent -->
    <g>
      <line x1="-40" y1="0" x2="0" y2="0" stroke="url(#cometTail)" stroke-width="2">
        <animateMotion dur="13s" repeatCount="indefinite"
          keyPoints="0;0.12;0.12;1" keyTimes="0;0.12;0.13;1" calcMode="linear"
          path="M 60,40 L 300,170" />
      </line>
      <circle cx="0" cy="0" r="1.8" fill="#F5F7FF">
        <animateMotion dur="13s" repeatCount="indefinite"
          keyPoints="0;0.12;0.12;1" keyTimes="0;0.12;0.13;1" calcMode="linear"
          path="M 60,40 L 300,170" />
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.11;0.13;1" dur="13s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- chrome bar -->
    <rect x="0" y="0" width="1000" height="34" fill="#070A16" fill-opacity="0.7" />
    <line x1="0" y1="34" x2="1000" y2="34" stroke="#1E293B" stroke-width="1" />
    <circle cx="20" cy="17" r="4" fill="none" stroke="#475569" stroke-width="1.2" />
    <circle cx="36" cy="17" r="4" fill="none" stroke="#475569" stroke-width="1.2" />
    <circle cx="52" cy="17" r="4" fill="none" stroke="#475569" stroke-width="1.2" />
    <text x="72" y="21" class="mono" font-size="12" fill="#64748B">terminal://identity.initializing</text>
    <text x="980" y="21" text-anchor="end" class="mono" font-size="12" fill="#64748B">STATUS: ONLINE</text>
    <circle cx="875" cy="17" r="3" fill="#34D399">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>

    <!-- HUD corner ticks (lower area) -->
    <path d="M 20,420 L 20,398 M 20,420 L 42,420" stroke="#22D3EE" stroke-width="1" opacity="0.4" />
    <path d="M 980,420 L 980,398 M 980,420 L 958,420" stroke="#22D3EE" stroke-width="1" opacity="0.4" />

    <!-- boot lines -->
    <g class="mono" font-size="14" fill="#7DD3FC" opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.09;1" dur="7.5s" begin="0s" repeatCount="1" fill="freeze" />
      <text x="40" y="72">&gt; INITIATING IDENTITY PROTOCOL...</text>
      <text x="40" y="94">&gt; LOADING...</text>
    </g>

    <!-- name -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.20;0.34;1" dur="7.5s" begin="0s" repeatCount="1" fill="freeze" />
      <text x="40" y="172" class="mono" font-size="60" letter-spacing="8" fill="#F5F7FF" font-weight="600">DARSHIL</text>
      <rect x="330" y="140" width="12" height="42" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="2.55s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- statement box -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.56;1" dur="7.5s" begin="0s" repeatCount="1" fill="freeze" />
      <rect x="40" y="200" width="420" height="72" rx="4" fill="#0A0E1A" fill-opacity="0.6" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1" />
      <text x="56" y="228" class="mono" font-size="13.5" fill="#E5E7EB">I build intelligent systems that turn messy</text>
      <text x="56" y="248" class="mono" font-size="13.5" fill="#E5E7EB">ideas into working software — then rebuild</text>
      <text x="56" y="264" class="mono" font-size="13.5" fill="#E5E7EB">until it holds.</text>
    </g>

    <!-- ready line -->
    <g class="mono" font-size="13" fill="#34D399" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.86;0.94;1" dur="7.5s" begin="0s" repeatCount="1" fill="freeze" />
      <text x="40" y="310">&gt; READY.</text>
    </g>

    <!-- info table (trimmed: no college / internship rows) -->
    <g class="mono" font-size="12.5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.80;1" dur="7.5s" begin="0s" repeatCount="1" fill="freeze" />
      <text x="530" y="96" fill="#7DD3FC" letter-spacing="1">ROLE</text>
      <text x="660" y="96" fill="#F5F7FF">AI/ML ENGINEER IN PROGRESS</text>
      <text x="530" y="122" fill="#7DD3FC" letter-spacing="1">FOCUS</text>
      <text x="660" y="122" fill="#F5F7FF">SYSTEMS &#183; AI &#183; AUTOMATION</text>
      <text x="530" y="148" fill="#7DD3FC" letter-spacing="1">LOCATION</text>
      <text x="660" y="148" fill="#F5F7FF">INDIA</text>
      <text x="530" y="174" fill="#7DD3FC" letter-spacing="1">STATUS</text>
      <text x="660" y="174" fill="#A7F3D0">BUILDING</text>
      <line x1="530" y1="72" x2="530" y2="190" stroke="#1E293B" stroke-width="1" />
    </g>

    <!-- baseline scan -->
    <rect x="0" y="437" width="1000" height="2" fill="url(#scanGrad)">
      <animate attributeName="x" values="-1000;1000" dur="10s" repeatCount="indefinite" />
    </rect>

    <!-- scroll chevron -->
    <g class="mono" opacity="0">
      <animate attributeName="opacity" values="0;0;0.7;0.7" keyTimes="0;0.86;0.94;1" dur="7.5s" begin="0s" repeatCount="1" fill="freeze" />
      <path d="M 493,410 L 500,418 L 507,410" stroke="#64748B" stroke-width="1.4" fill="none">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </path>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="999" height="439" rx="10" fill="none" stroke="#1E293B" stroke-width="1" />
</svg>
