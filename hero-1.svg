      <line x1="0" y1="295" x2="1000" y2="295" opacity="0.4" />
    </g>

    <!-- planet horizon (main) -->
    <circle cx="820" cy="510" r="230" fill="url(#planetGrad)" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.25" />
    <!-- distant moon, upper right -->
    <circle cx="930" cy="64" r="22" fill="url(#moonGrad)" stroke="#334155" stroke-width="1" />
    <path d="M 918,52 A 22,22 0 0 0 918,76 A 17,22 0 0 1 918,52 Z" fill="#040509" fill-opacity="0.55" />

    <!-- starfield -->
    <circle cx="913.0" cy="334.4" r="1.3" fill="#F5F7FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="1.89s" repeatCount="indefinite" /></circle>
    <circle cx="529.2" cy="85.6" r="0.67" fill="#F5F7FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.27s" begin="0.71s" repeatCount="indefinite" /></circle>
