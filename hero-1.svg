<svg width="100%" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Darshil — identity terminal: boot sequence, name reveal, mission statement, and system status, over a deep-space field">
  <defs>
    <radialGradient id="bgGlow" cx="30%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#0E1730" />
      <stop offset="55%" stop-color="#070A16" />
      <stop offset="100%" stop-color="#040509" />
    </radialGradient>
    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="planetGrad" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#1B2A4A" />
      <stop offset="45%" stop-color="#0C1526" />
      <stop offset="100%" stop-color="#040509" />
    </radialGradient>
    <radialGradient id="moonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2A3B5C" />
      <stop offset="100%" stop-color="#0A0E1A" />
    </radialGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cometTail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5F7FF" stop-opacity="0" />
      <stop offset="100%" stop-color="#F5F7FF" stop-opacity="0.9" />
    </linearGradient>
    <clipPath id="panelClip"><rect x="1" y="1" width="998" height="438" rx="10" /></clipPath>
    <style>.mono { font-family: 'Fira Code','SFMono-Regular',Consolas,monospace; }</style>
  </defs>

  <g clip-path="url(#panelClip)">
    <rect width="1000" height="440" fill="url(#bgGlow)" />

    <!-- nebula wisps, low opacity, on-palette -->
    <ellipse cx="150" cy="330" rx="220" ry="140" fill="url(#nebula1)">
      <animate attributeName="cx" values="150;175;150" dur="26s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="770" cy="120" rx="260" ry="150" fill="url(#nebula2)">
      <animate attributeName="cx" values="770;740;770" dur="30s" repeatCount="indefinite" />
    </ellipse>

