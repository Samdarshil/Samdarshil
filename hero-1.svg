    <circle cx="68.4" cy="172.5" r="0.52" fill="#F5F7FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.14s" begin="2.2s" repeatCount="indefinite" /></circle>
    <circle cx="796.4" cy="334.4" r="0.98" fill="#F5F7FF"><animate attributeName="opacity" values="0.18;1;0.18" dur="4.57s" begin="2.4s" repeatCount="indefinite" /></circle>
    <circle cx="961.1" cy="160.6" r="0.67" fill="#F5F7FF"><animate attributeName="opacity" values="0.16;1;0.16" dur="2.38s" begin="1.49s" repeatCount="indefinite" /></circle>
    <circle cx="921.4" cy="334.9" r="0.69" fill="#F5F7FF"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.45s" begin="1.69s" repeatCount="indefinite" /></circle>
    <circle cx="542.4" cy="293.1" r="0.73" fill="#F5F7FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.21s" begin="2.88s" repeatCount="indefinite" /></circle>
    <circle cx="347.2" cy="317.3" r="1.23" fill="#F5F7FF"><animate attributeName="opacity" values="0.19;1;0.19" dur="4.35s" begin="2.2s" repeatCount="indefinite" /></circle>
    <circle cx="687.6" cy="298.3" r="1.08" fill="#F5F7FF"><animate attributeName="opacity" values="0.19;1;0.19" dur="2.77s" begin="0.94s" repeatCount="indefinite" /></circle>
    <circle cx="764.1" cy="215.4" r="0.99" fill="#F5F7FF"><animate attributeName="opacity" values="0.23;1;0.23" dur="4.18s" begin="0.35s" repeatCount="indefinite" /></circle>
    <circle cx="337.2" cy="216.0" r="1.25" fill="#F5F7FF"><animate attributeName="opacity" values="0.13;1;0.13" dur="2.8s" begin="3.04s" repeatCount="indefinite" /></circle>
    <circle cx="560.3" cy="210.7" r="0.71" fill="#F5F7FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.55s" begin="1.51s" repeatCount="indefinite" /></circle>
    <circle cx="712.3" cy="47.2" r="0.84" fill="#F5F7FF"><animate attributeName="opacity" values="0.28;1;0.28" dur="4.09s" begin="0.45s" repeatCount="indefinite" /></circle>
    <circle cx="211.9" cy="253.1" r="0.66" fill="#F5F7FF"><animate attributeName="opacity" values="0.13;1;0.13" dur="3.28s" begin="1.35s" repeatCount="indefinite" /></circle>
    <circle cx="694.0" cy="192.0" r="1.12" fill="#F5F7FF"><animate attributeName="opacity" values="0.21;1;0.21" dur="3.49s" begin="1.78s" repeatCount="indefinite" /></circle>
    <circle cx="303.5" cy="319.2" r="0.58" fill="#F5F7FF"><animate attributeName="opacity" values="0.21;1;0.21" dur="4.3s" begin="2.76s" repeatCount="indefinite" /></circle>
    <circle cx="769.2" cy="250.7" r="1.04" fill="#F5F7FF"><animate attributeName="opacity" values="0.18;1;0.18" dur="2.9s" begin="1.02s" repeatCount="indefinite" /></circle>
    <circle cx="307.7" cy="337.7" r="0.81" fill="#F5F7FF"><animate attributeName="opacity" values="0.27;1;0.27" dur="3.13s" begin="1.34s" repeatCount="indefinite" /></circle>
    <circle cx="478.4" cy="214.3" r="0.73" fill="#F5F7FF"><animate attributeName="opacity" values="0.16;1;0.16" dur="2.87s" begin="0.29s" repeatCount="indefinite" /></circle>
    <circle cx="270.5" cy="305.1" r="0.95" fill="#F5F7FF"><animate attributeName="opacity" values="0.14;1;0.14" dur="2.46s" begin="1.48s" repeatCount="indefinite" /></circle>
    <circle cx="564.2" cy="180.4" r="1.27" fill="#F5F7FF"><animate attributeName="opacity" values="0.16;1;0.16" dur="2.82s" begin="2.72s" repeatCount="indefinite" /></circle>
    <circle cx="969.1" cy="238.8" r="0.54" fill="#F5F7FF"><animate attributeName="opacity" values="0.19;1;0.19" dur="4.14s" begin="0.88s" repeatCount="indefinite" /></circle>
    <circle cx="156.5" cy="300.6" r="0.58" fill="#F5F7FF"><animate attributeName="opacity" values="0.24;1;0.24" dur="3.97s" begin="1.27s" repeatCount="indefinite" /></circle>
