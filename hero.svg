<svg width="100%" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Darshil — identity terminal: boot sequence, name reveal, mission statement, and system status">
  <defs>
    <radialGradient id="bgGlow" cx="30%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#0E1730" />
      <stop offset="55%" stop-color="#070A16" />
      <stop offset="100%" stop-color="#040509" />
    </radialGradient>
    <radialGradient id="planetGrad" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#1B2A4A" />
      <stop offset="45%" stop-color="#0C1526" />
      <stop offset="100%" stop-color="#040509" />
    </radialGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </linearGradient>
    <clipPath id="panelClip"><rect x="1" y="1" width="998" height="438" rx="10" /></clipPath>
    <style>.mono { font-family: 'Fira Code','SFMono-Regular',Consolas,monospace; }</style>
  </defs>

  <g clip-path="url(#panelClip)">
    <rect width="1000" height="440" fill="url(#bgGlow)" />
    <!-- planet horizon -->
    <circle cx="820" cy="510" r="230" fill="url(#planetGrad)" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.25" />

    <!-- starfield -->
    <circle cx="913.0" cy="334.6" r="1.49" fill="#F5F7FF"><animate attributeName="opacity" values="0.22;1;0.22" dur="2.57s" begin="1.78s" repeatCount="indefinite" /></circle>
    <circle cx="529.2" cy="89.1" r="0.79" fill="#F5F7FF"><animate attributeName="opacity" values="0.23;1;0.23" dur="3.29s" begin="0.66s" repeatCount="indefinite" /></circle>
    <circle cx="38.1" cy="75.7" r="1.31" fill="#F5F7FF"><animate attributeName="opacity" values="0.27;1;0.27" dur="3.24s" begin="1.54s" repeatCount="indefinite" /></circle>
    <circle cx="362.9" cy="67.3" r="1.38" fill="#F5F7FF"><animate attributeName="opacity" values="0.26;1;0.26" dur="3.58s" begin="1.97s" repeatCount="indefinite" /></circle>
    <circle cx="957.6" cy="158.8" r="1.36" fill="#F5F7FF"><animate attributeName="opacity" values="0.26;1;0.26" dur="3.14s" begin="1.72s" repeatCount="indefinite" /></circle>
    <circle cx="319.6" cy="75.7" r="1.07" fill="#F5F7FF"><animate attributeName="opacity" values="0.23;1;0.23" dur="3.84s" begin="1.77s" repeatCount="indefinite" /></circle>
    <circle cx="638.4" cy="104.6" r="0.78" fill="#F5F7FF"><animate attributeName="opacity" values="0.18;1;0.18" dur="3.05s" begin="2.45s" repeatCount="indefinite" /></circle>
    <circle cx="125.1" cy="79.6" r="0.64" fill="#F5F7FF"><animate attributeName="opacity" values="0.29;1;0.29" dur="2.95s" begin="1.72s" repeatCount="indefinite" /></circle>
    <circle cx="335.5" cy="160.9" r="0.89" fill="#F5F7FF"><animate attributeName="opacity" values="0.24;1;0.24" dur="3.01s" begin="2.33s" repeatCount="indefinite" /></circle>
    <circle cx="265.2" cy="82.1" r="1.38" fill="#F5F7FF"><animate attributeName="opacity" values="0.19;1;0.19" dur="3.81s" begin="2.49s" repeatCount="indefinite" /></circle>
    <circle cx="544.2" cy="325.6" r="1.19" fill="#F5F7FF"><animate attributeName="opacity" values="0.32;1;0.32" dur="4.29s" begin="0.5s" repeatCount="indefinite" /></circle>
    <circle cx="68.4" cy="174.9" r="0.62" fill="#F5F7FF"><animate attributeName="opacity" values="0.32;1;0.32" dur="4.02s" begin="2.06s" repeatCount="indefinite" /></circle>
    <circle cx="796.4" cy="334.6" r="1.14" fill="#F5F7FF"><animate attributeName="opacity" values="0.21;1;0.21" dur="4.38s" begin="2.25s" repeatCount="indefinite" /></circle>
    <circle cx="961.1" cy="163.1" r="0.79" fill="#F5F7FF"><animate attributeName="opacity" values="0.18;1;0.18" dur="2.55s" begin="1.4s" repeatCount="indefinite" /></circle>
    <circle cx="921.4" cy="335.1" r="0.82" fill="#F5F7FF"><animate attributeName="opacity" values="0.18;1;0.18" dur="2.61s" begin="1.59s" repeatCount="indefinite" /></circle>
    <circle cx="542.4" cy="293.9" r="0.85" fill="#F5F7FF"><animate attributeName="opacity" values="0.23;1;0.23" dur="3.24s" begin="2.7s" repeatCount="indefinite" /></circle>
    <circle cx="347.2" cy="317.7" r="1.41" fill="#F5F7FF"><animate attributeName="opacity" values="0.22;1;0.22" dur="4.19s" begin="2.06s" repeatCount="indefinite" /></circle>
    <circle cx="687.6" cy="298.9" r="1.24" fill="#F5F7FF"><animate attributeName="opacity" values="0.22;1;0.22" dur="2.88s" begin="0.89s" repeatCount="indefinite" /></circle>
    <circle cx="764.1" cy="217.1" r="1.15" fill="#F5F7FF"><animate attributeName="opacity" values="0.26;1;0.26" dur="4.05s" begin="0.33s" repeatCount="indefinite" /></circle>
    <circle cx="337.2" cy="217.8" r="1.44" fill="#F5F7FF"><animate attributeName="opacity" values="0.16;1;0.16" dur="2.9s" begin="2.85s" repeatCount="indefinite" /></circle>
    <circle cx="560.3" cy="212.5" r="0.84" fill="#F5F7FF"><animate attributeName="opacity" values="0.23;1;0.23" dur="3.52s" begin="1.41s" repeatCount="indefinite" /></circle>
    <circle cx="712.3" cy="51.2" r="0.98" fill="#F5F7FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.97s" begin="0.43s" repeatCount="indefinite" /></circle>
    <circle cx="211.9" cy="254.3" r="0.77" fill="#F5F7FF"><animate attributeName="opacity" values="0.16;1;0.16" dur="3.3s" begin="1.27s" repeatCount="indefinite" /></circle>
    <circle cx="694.0" cy="194.1" r="1.29" fill="#F5F7FF"><animate attributeName="opacity" values="0.24;1;0.24" dur="3.48s" begin="1.67s" repeatCount="indefinite" /></circle>
    <circle cx="303.5" cy="319.6" r="0.69" fill="#F5F7FF"><animate attributeName="opacity" values="0.23;1;0.23" dur="4.15s" begin="2.59s" repeatCount="indefinite" /></circle>
    <circle cx="769.2" cy="252.0" r="1.21" fill="#F5F7FF"><animate attributeName="opacity" values="0.21;1;0.21" dur="2.98s" begin="0.96s" repeatCount="indefinite" /></circle>

    <!-- chrome bar -->
    <rect x="0" y="0" width="1000" height="34" fill="#070A16" fill-opacity="0.7" />
    <line x1="0" y1="34" x2="1000" y2="34" stroke="#1E293B" stroke-width="1" />
    <circle cx="20" cy="17" r="4" fill="none" stroke="#475569" stroke-width="1.2" />
    <circle cx="36" cy="17" r="4" fill="none" stroke="#475569" stroke-width="1.2" />
    <circle cx="52" cy="17" r="4" fill="none" stroke="#475569" stroke-width="1.2" />
    <text x="72" y="21" class="mono" font-size="12" fill="#64748B">terminal://identity.initializing</text>
    <text x="980" y="21" text-anchor="end" class="mono" font-size="12" fill="#64748B">STATUS: ONLINE</text>
    <circle cx="875" cy="17" r="3" fill="#34D399">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>

    <!-- HUD corner ticks (lower area) -->
    <path d="M 20,420 L 20,398 M 20,420 L 42,420" stroke="#22D3EE" stroke-width="1" opacity="0.4" />
    <path d="M 980,420 L 980,398 M 980,420 L 958,420" stroke="#22D3EE" stroke-width="1" opacity="0.4" />

    <!-- boot lines -->
    <g class="mono" font-size="14" fill="#7DD3FC" opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.09;1" dur="7.5s" begin="0s" repeatCount="1" fill="freeze" />
      <text x="40" y="72">&gt; INITIATING IDENTITY PROTOCOL...</text>
      <text x="40" y="94">&gt; LOADING...</text>
    </g>

    <!-- name -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.20;0.34;1" dur="7.5s" begin="0s" repeatCount="1" fill="freeze" />
      <text x="40" y="172" class="mono" font-size="60" letter-spacing="8" fill="#F5F7FF" font-weight="600">DARSHIL</text>
      <rect x="330" y="140" width="12" height="42" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="2.55s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- statement box -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.42;0.56;1" dur="7.5s" begin="0s" repeatCount="1" fill="freeze" />
      <rect x="40" y="200" width="420" height="72" rx="4" fill="#0A0E1A" fill-opacity="0.6" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1" />
      <text x="56" y="228" class="mono" font-size="13.5" fill="#E5E7EB">I build intelligent systems that turn messy</text>
      <text x="56" y="248" class="mono" font-size="13.5" fill="#E5E7EB">ideas into working software — then rebuild</text>
      <text x="56" y="264" class="mono" font-size="13.5" fill="#E5E7EB">until it holds.</text>
    </g>

    <!-- ready line -->
    <g class="mono" font-size="13" fill="#34D399" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.86;0.94;1" dur="7.5s" begin="0s" repeatCount="1" fill="freeze" />
      <text x="40" y="310">&gt; READY.</text>
    </g>

    <!-- info table -->
    <g class="mono" font-size="12.5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.80;1" dur="7.5s" begin="0s" repeatCount="1" fill="freeze" />
      <text x="530" y="96" fill="#7DD3FC" letter-spacing="1">ROLE</text>
      <text x="660" y="96" fill="#F5F7FF">AI/ML ENGINEER IN PROGRESS</text>
      <text x="530" y="122" fill="#7DD3FC" letter-spacing="1">FOCUS</text>
      <text x="660" y="122" fill="#F5F7FF">SYSTEMS &#183; AI &#183; AUTOMATION</text>
      <text x="530" y="148" fill="#7DD3FC" letter-spacing="1">WITH</text>
      <text x="660" y="148" fill="#F5F7FF">BCA (AI/ML) @ JNU</text>
      <text x="530" y="174" fill="#7DD3FC" letter-spacing="1">INTERN</text>
      <text x="660" y="174" fill="#F5F7FF">DECODELABS</text>
      <text x="530" y="200" fill="#7DD3FC" letter-spacing="1">LOCATION</text>
      <text x="660" y="200" fill="#F5F7FF">INDIA</text>
      <text x="530" y="226" fill="#7DD3FC" letter-spacing="1">STATUS</text>
      <text x="660" y="226" fill="#A7F3D0">BUILDING</text>
      <line x1="530" y1="72" x2="530" y2="240" stroke="#1E293B" stroke-width="1" />
    </g>

    <!-- baseline scan -->
    <rect x="0" y="437" width="1000" height="2" fill="url(#scanGrad)">
      <animate attributeName="x" values="-1000;1000" dur="10s" repeatCount="indefinite" />
    </rect>

    <!-- scroll chevron -->
    <g class="mono" opacity="0">
      <animate attributeName="opacity" values="0;0;0.7;0.7" keyTimes="0;0.86;0.94;1" dur="7.5s" begin="0s" repeatCount="1" fill="freeze" />
      <path d="M 493,410 L 500,418 L 507,410" stroke="#64748B" stroke-width="1.4" fill="none">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </path>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="999" height="439" rx="10" fill="none" stroke="#1E293B" stroke-width="1" />
</svg>
