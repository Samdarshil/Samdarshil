<svg width="100%" viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Orbital map of active missions: Career Guardian AI, DecodeLabs, VOID's Calamity, D&amp;A Digital Solutions, orbiting a central star labeled Darshil">
  <defs>
    <radialGradient id="orbBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0E1630" />
      <stop offset="60%" stop-color="#070A16" />
      <stop offset="100%" stop-color="#040509" />
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="900" height="470" fill="url(#orbBg)" />
  <rect x="0.5" y="0.5" width="899" height="469" fill="none" stroke="#1E293B" stroke-width="1" />

  <!-- starfield -->
  <circle cx="293.6" cy="75.1" r="1.09" fill="#F5F7FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.74s" begin="1.61s" repeatCount="indefinite" /></circle>
  <circle cx="57.5" cy="238.4" r="0.53" fill="#F5F7FF"><animate attributeName="opacity" values="0.16;1;0.16" dur="3.47s" begin="0.21s" repeatCount="indefinite" /></circle>
  <circle cx="383.0" cy="384.7" r="0.61" fill="#F5F7FF"><animate attributeName="opacity" values="0.29;1;0.29" dur="3.05s" begin="1.88s" repeatCount="indefinite" /></circle>
  <circle cx="518.5" cy="187.7" r="1.38" fill="#F5F7FF"><animate attributeName="opacity" values="0.19;1;0.19" dur="2.69s" begin="2.58s" repeatCount="indefinite" /></circle>
  <circle cx="134.1" cy="59.9" r="0.78" fill="#F5F7FF"><animate attributeName="opacity" values="0.24;1;0.24" dur="4.23s" begin="0.54s" repeatCount="indefinite" /></circle>
  <circle cx="573.4" cy="176.6" r="0.99" fill="#F5F7FF"><animate attributeName="opacity" values="0.18;1;0.18" dur="2.73s" begin="0.18s" repeatCount="indefinite" /></circle>
  <circle cx="610.2" cy="201.8" r="0.78" fill="#F5F7FF"><animate attributeName="opacity" values="0.19;1;0.19" dur="3.77s" begin="1.36s" repeatCount="indefinite" /></circle>
  <circle cx="711.4" cy="326.1" r="0.72" fill="#F5F7FF"><animate attributeName="opacity" values="0.28;1;0.28" dur="3.75s" begin="1.58s" repeatCount="indefinite" /></circle>
  <circle cx="653.7" cy="137.9" r="1.38" fill="#F5F7FF"><animate attributeName="opacity" values="0.26;1;0.26" dur="2.84s" begin="1.25s" repeatCount="indefinite" /></circle>
  <circle cx="141.0" cy="229.9" r="0.54" fill="#F5F7FF"><animate attributeName="opacity" values="0.24;1;0.24" dur="3.94s" begin="2.29s" repeatCount="indefinite" /></circle>
  <circle cx="783.4" cy="149.7" r="1.13" fill="#F5F7FF"><animate attributeName="opacity" values="0.22;1;0.22" dur="3.79s" begin="1.74s" repeatCount="indefinite" /></circle>
  <circle cx="751.9" cy="438.7" r="0.93" fill="#F5F7FF"><animate attributeName="opacity" values="0.26;1;0.26" dur="3.93s" begin="0.18s" repeatCount="indefinite" /></circle>
  <circle cx="580.7" cy="460.8" r="1.24" fill="#F5F7FF"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.17s" begin="1.16s" repeatCount="indefinite" /></circle>
  <circle cx="26.0" cy="217.5" r="0.65" fill="#F5F7FF"><animate attributeName="opacity" values="0.27;1;0.27" dur="2.83s" begin="0.18s" repeatCount="indefinite" /></circle>
  <circle cx="120.9" cy="119.4" r="0.85" fill="#F5F7FF"><animate attributeName="opacity" values="0.22;1;0.22" dur="4.34s" begin="0.24s" repeatCount="indefinite" /></circle>
  <circle cx="493.9" cy="410.6" r="1.24" fill="#F5F7FF"><animate attributeName="opacity" values="0.21;1;0.21" dur="4.33s" begin="0.84s" repeatCount="indefinite" /></circle>
  <circle cx="324.6" cy="411.0" r="1.36" fill="#F5F7FF"><animate attributeName="opacity" values="0.18;1;0.18" dur="2.9s" begin="0.53s" repeatCount="indefinite" /></circle>
  <circle cx="213.2" cy="228.1" r="1.03" fill="#F5F7FF"><animate attributeName="opacity" values="0.21;1;0.21" dur="3.13s" begin="0.01s" repeatCount="indefinite" /></circle>
  <circle cx="333.9" cy="265.4" r="1.36" fill="#F5F7FF"><animate attributeName="opacity" values="0.24;1;0.24" dur="3.98s" begin="1.55s" repeatCount="indefinite" /></circle>
  <circle cx="606.5" cy="30.7" r="1.31" fill="#F5F7FF"><animate attributeName="opacity" values="0.27;1;0.27" dur="4.16s" begin="2.62s" repeatCount="indefinite" /></circle>
  <circle cx="354.4" cy="188.7" r="0.59" fill="#F5F7FF"><animate attributeName="opacity" values="0.16;1;0.16" dur="3.87s" begin="0.19s" repeatCount="indefinite" /></circle>
  <circle cx="191.4" cy="80.3" r="0.81" fill="#F5F7FF"><animate attributeName="opacity" values="0.17;1;0.17" dur="2.71s" begin="0.0s" repeatCount="indefinite" /></circle>
  <circle cx="96.1" cy="172.5" r="0.52" fill="#F5F7FF"><animate attributeName="opacity" values="0.17;1;0.17" dur="4.35s" begin="1.84s" repeatCount="indefinite" /></circle>
  <circle cx="230.0" cy="165.1" r="0.83" fill="#F5F7FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.85s" begin="2.55s" repeatCount="indefinite" /></circle>
  <circle cx="419.8" cy="227.6" r="0.58" fill="#F5F7FF"><animate attributeName="opacity" values="0.19;1;0.19" dur="2.8s" begin="1.03s" repeatCount="indefinite" /></circle>
  <circle cx="742.0" cy="79.9" r="0.52" fill="#F5F7FF"><animate attributeName="opacity" values="0.17;1;0.17" dur="4.5s" begin="1.58s" repeatCount="indefinite" /></circle>
  <circle cx="488.3" cy="18.4" r="0.98" fill="#F5F7FF"><animate attributeName="opacity" values="0.25;1;0.25" dur="4.56s" begin="2.59s" repeatCount="indefinite" /></circle>
