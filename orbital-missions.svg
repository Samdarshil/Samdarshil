  <!-- static orbit guides -->
  <circle cx="450" cy="250" r="235" fill="none" stroke="#1E293B" stroke-width="1" />
  <circle cx="450" cy="250" r="185" fill="none" stroke="#1E293B" stroke-width="1" />
  <circle cx="450" cy="250" r="195" fill="none" stroke="#1E293B" stroke-width="1" />
  <circle cx="450" cy="250" r="165" fill="none" stroke="#1E293B" stroke-width="1" />

  <!-- central star: DARSHIL -->
  <circle cx="450" cy="250" r="34" fill="url(#starGlow)">
    <animate attributeName="r" values="30;36;30" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="450" cy="250" r="7" fill="#F5F7FF" />
  <text x="450" y="306" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="16" letter-spacing="3" fill="#F5F7FF" font-weight="600">DARSHIL</text>

  <!-- orbiting missions -->

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 450 250" to="360 450 250" dur="70s" repeatCount="indefinite" />
    <circle cx="685.0" cy="250.0" r="14" fill="#22D3EE" opacity="0.15" />
    <circle cx="685.0" cy="250.0" r="9" fill="#22D3EE" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 685.0 250.0" to="-360 685.0 250.0" dur="70s" repeatCount="indefinite" />
      <text x="685.0" y="225.0" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="15" fill="#E5E7EB" font-weight="600">CAREER GUARDIAN AI</text>
      <text x="685.0" y="243.0" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="12" fill="#22D3EE" letter-spacing="1">ACTIVE</text>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 450 250" to="-360 450 250" dur="95s" repeatCount="indefinite" />
    <circle cx="450.0" cy="435.0" r="12" fill="#E5E7EB" opacity="0.15" />
    <circle cx="450.0" cy="435.0" r="7" fill="#E5E7EB" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 450.0 435.0" to="360 450.0 435.0" dur="95s" repeatCount="indefinite" />
      <text x="450.0" y="412.0" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="15" fill="#E5E7EB" font-weight="600">DECODELABS</text>
      <text x="450.0" y="430.0" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="12" fill="#E5E7EB" letter-spacing="1">ACTIVE</text>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 450 250" to="360 450 250" dur="82s" repeatCount="indefinite" />
    <circle cx="450.0" cy="55.0" r="12" fill="#A78BFA" opacity="0.15" />
    <circle cx="450.0" cy="55.0" r="7" fill="#A78BFA" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 450.0 55.0" to="-360 450.0 55.0" dur="82s" repeatCount="indefinite" />
      <text x="450.0" y="32.0" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="15" fill="#E5E7EB" font-weight="600">VOID'S CALAMITY</text>
      <text x="450.0" y="50.0" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="12" fill="#A78BFA" letter-spacing="1">IN DEVELOPMENT</text>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 450 250" to="-360 450 250" dur="108s" repeatCount="indefinite" />
    <circle cx="285.0" cy="250.0" r="11" fill="#60A5FA" opacity="0.15" />
    <circle cx="285.0" cy="250.0" r="6" fill="#60A5FA" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 285.0 250.0" to="360 285.0 250.0" dur="108s" repeatCount="indefinite" />
      <text x="285.0" y="228.0" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="15" fill="#E5E7EB" font-weight="600">D&amp;A DIGITAL</text>
      <text x="285.0" y="246.0" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="12" fill="#60A5FA" letter-spacing="1">EARLY STAGE</text>
    </g>
  </g>

  <!-- flagship satellite -->

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 450 250" to="360 450 250" dur="70s" repeatCount="indefinite" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 685.0 250.0" to="360 685.0 250.0" dur="6s" repeatCount="indefinite" />
      <circle cx="703.0" cy="250.0" r="1.8" fill="#F5F7FF" />
    </g>
  </g>
</svg>
