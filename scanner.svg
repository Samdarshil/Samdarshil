<svg width="100%" viewBox="0 0 900 50" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System telemetry panel header with scanning indicator">
  <defs>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0F1E" />
      <stop offset="100%" stop-color="#050710" />
    </linearGradient>
  </defs>

  <rect width="900" height="50" fill="url(#panelBg)" />
  <rect x="0.5" y="0.5" width="899" height="49" fill="none" stroke="#1E293B" stroke-width="1" />

  <text x="20" y="32" font-family="'Fira Code',Consolas,monospace" font-size="17" letter-spacing="2" fill="#E5E7EB" font-weight="600">SYSTEM TELEMETRY</text>
  <circle cx="228" cy="26" r="3.5" fill="#34D399">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
  </circle>

  <line x1="270" y1="25" x2="880" y2="25" stroke="#1E293B" stroke-width="1" />

  <clipPath id="clip">
    <rect x="270" y="0" width="610" height="50" />
  </clipPath>

  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="26" height="50" fill="url(#scanBeam)">
      <animate attributeName="x" values="250;860" dur="4.5s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
