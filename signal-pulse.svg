<svg width="120" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Unresolved signal — pulsing classified marker">
  <defs>
    <radialGradient id="pulseGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="70.0" cy="70.0" r="8" fill="url(#pulseGrad)">
    <animate attributeName="r" values="8;60;8" dur="3.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="3.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="70.0" cy="70.0" r="8" fill="url(#pulseGrad)" begin="1.6s">
    <animate attributeName="r" values="8;60;8" dur="3.2s" begin="1.6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="3.2s" begin="1.6s" repeatCount="indefinite" />
  </circle>

  <circle cx="70.0" cy="70.0" r="30" fill="none" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="70.0" cy="70.0" r="4.5" fill="#E9D5FF" />

  <text x="70.0" y="112.0" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="9.5" letter-spacing="1.5" fill="#A78BFA">UNRESOLVED</text>
</svg>
